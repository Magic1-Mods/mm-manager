name: Android CI

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java + Gradle cache
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Cache SDK components downloaded by AGP
      - name: Cache Android SDK Components
        uses: actions/cache@v4
        with:
          path: |
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmake
            ~/Android/Sdk/build-tools
            ~/Android/Sdk/platforms
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle', '**/build.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # Cache native build intermediates
      - name: Cache Native Build
        uses: actions/cache@v4
        with:
          path: |
            **/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('**/*.cpp', '**/*.c', '**/*.h', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Debug
        run: |
          ./gradlew \
            assembleRelease \
            --build-cache \
            --configuration-cache \
            --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MM-Manager-Debug
          path: app/build/outputs/apk/debug/*.apk
