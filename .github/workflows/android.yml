name: Android CI

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      ANDROID_NDK_VERSION: 26.3.11579264
      ANDROID_CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java + Gradle cache
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Cache NDK + CMake downloaded by AGP
      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmake
          key: ${{ runner.os }}-ndk-cmake-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_CMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-ndk-cmake-

      # Cache native build state
      - name: Cache Native Build
        uses: actions/cache@v4
        with:
          path: |
            **/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('**/*.cpp', '**/*.c', '**/*.h', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build
      - name: Assemble Debug
        run: |
          ./gradlew \
            assembleDebug \
            --build-cache \
            --configuration-cache \
            --parallel

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MM-Manager-Debug
          path: app/build/outputs/apk/debug/*.apk