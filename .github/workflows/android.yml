name: Android CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      ANDROID_NDK_VERSION: 26.3.11579264
      ANDROID_CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Android SDK + NDK + CMake
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      # Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cache Android SDK components
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmake
            ~/Android/Sdk/build-tools
            ~/Android/Sdk/platforms
          key: ${{ runner.os }}-android-${{ env.ANDROID_NDK_VERSION }}

      # Cache C/C++ build intermediates
      - name: Cache Native Build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates
            app/build/generated
          key: ${{ runner.os }}-native-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build
      - name: Assemble Debug
        run: ./gradlew assembleDebug --build-cache

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MM-Manager-Debug
          path: app/build/outputs/apk/debug/*.apk